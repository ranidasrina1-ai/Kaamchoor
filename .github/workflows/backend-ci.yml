name: Backend CI

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: API + realtime tests (MariaDB)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kaamchor
          MYSQL_USER: kaamchor
          MYSQL_PASSWORD: kaamchor123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      DATABASE_URL: mysql+pymysql://kaamchor:kaamchor123@127.0.0.1:3306/kaamchor
      JWT_SECRET_KEY: ci-secret-key-please-change-1234567890
      SERVER_BASE_URL: http://127.0.0.1:5000
      FLASK_SECRET_KEY: ci-flask-secret

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Byte-compile backend
        working-directory: backend
        run: python -m compileall -q .

      - name: HTTP integration test
        working-directory: backend
        run: python tests/test_integration.py

      - name: Start API server
        working-directory: backend
        run: |
          nohup python app.py > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5000/api/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:5000/api/health

      - name: Realtime Socket.IO test
        working-directory: backend
        run: python tests/test_realtime.py

      - name: Server log
        if: always()
        run: tail -n 100 /tmp/server.log || true
